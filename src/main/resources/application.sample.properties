# ====================================
# APPLICATION DE TEST NOTIFICATION
# ====================================
spring.application.name=notification-module
server.port=8080

# ====================================
# DATABASE CONFIGURATION (H2 pour tests)
# ====================================
# Base de données en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ====================================
# SWAGGER/OPENAPI CONFIGURATION
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ====================================
# NOTIFICATION MODULE CONFIGURATION
# ====================================

# Activation générale
notification.enabled=true

# EMAIL CONFIGURATION (Gmail pour test)
notification.email.enabled=true
notification.email.host=smtp.gmail.com
notification.email.port=587
notification.email.username=
notification.email.password=
notification.email.from=
notification.email.from-name=Service Notification Test
notification.email.auth-enabled=true
notification.email.tls-enabled=false
notification.email.start-tls-enabled=true
notification.email.protocol=smtp
notification.email.debug=false

# SMS CONFIGURATION (Twilio pour test)
notification.sms.enabled=false
notification.sms.provider=twilio
notification.sms.from-number=+1234567890
notification.sms.twilio.account-sid=votre-twilio-sid
notification.sms.twilio.auth-token=votre-twilio-token
notification.sms.twilio.messaging-service-sid=your-messaging-service-sid

# AWS SNS Configuration
notification.sms.aws-sns.access-key=your-aws-access-key
notification.sms.aws-sns.secret-key=your-aws-secret-key
notification.sms.aws-sns.region=us-east-1

# Generic SMS Configuration
notification.sms.api-key=your-sms-api-key
notification.sms.api-secret=your-sms-api-secret

# ===============================
# PUSH NOTIFICATION CONFIGURATION
# ===============================
notification.push.enabled=true
notification.push.provider=firebase
notification.push.server-url=https://fcm.googleapis.com/fcm/send

# Firebase Configuration
notification.push.firebase.project-id=your-firebase-project-id
notification.push.firebase.credentials-path=firebase-credentials.json
# OU directement le JSON (pour environnements cloud)
# notification.push.firebase.credentials-json={"type":"service_account"...}

# Generic Push Configuration
notification.push.api-key=your-push-api-key
notification.push.api-secret=your-push-api-secret

# ===============================
# WEB NOTIFICATION CONFIGURATION
# ===============================
notification.web.enabled=true
notification.web.cache.enabled=true
notification.web.cache.max-size=10000
notification.web.cache.ttl=7d
notification.web.cache.cleanup-interval=1h

# Web Push Configuration
notification.web.push.enabled=false
notification.web.push.public-key=your-web-push-public-key
notification.web.push.private-key=your-web-push-private-key
notification.web.push.subject=mailto:admin@yourapp.com

# Webhook Configuration
notification.web.webhook.enabled=false
notification.web.webhook.url=https://your-app.com/api/webhooks/notifications
notification.web.webhook.secret=your-webhook-secret
notification.web.webhook.timeout=5000
notification.web.webhook.retry-attempts=3


# WEBSOCKET CONFIGURATION
notification.websocket.enabled=true
notification.websocket.endpoint=/ws/notifications
notification.websocket.allowed-origins=*

# CACHE CONFIGURATION
spring.cache.cache-names=userNotifications,unreadNotifications,unreadCount
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h

# ====================================
# LOGGING CONFIGURATION
# ====================================
logging.level.module.notification=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====================================
# ASYNC CONFIGURATION
# ====================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=notification-async-

# ====================================
# ACTUATOR (pour monitoring)
# ====================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Configuration Redis pour le Rate Limiting avancé
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=2s
spring.data.redis.password=

spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=5s

# Circuit Breaker Configuration
notification.circuit-breaker.enabled=true
notification.circuit-breaker.email.failure-threshold=5
notification.circuit-breaker.email.timeout-duration=5m
notification.circuit-breaker.email.retry-interval=30s

notification.circuit-breaker.sms.failure-threshold=3
notification.circuit-breaker.sms.timeout-duration=10m
notification.circuit-breaker.sms.retry-interval=1m

notification.circuit-breaker.push.failure-threshold=10
notification.circuit-breaker.push.timeout-duration=3m
notification.circuit-breaker.push.retry-interval=45s

# Retry Configuration avancée
notification.retry.max-attempts=5
notification.retry.initial-delay=5m
notification.retry.max-delay=2h
notification.retry.backoff-multiplier=2.0
notification.retry.exponential-backoff=true
notification.retry.stuck-timeout=30m

# Rate Limiting avancé
notification.rate-limit.enabled=true
notification.rate-limit.use-redis=true
notification.rate-limit.max-notifications-per-user-per-minute=10
notification.rate-limit.max-notifications-per-user-per-hour=100

# Par canal
notification.rate-limit.max-email-per-hour=500
notification.rate-limit.max-sms-per-hour=100
notification.rate-limit.max-push-per-hour=2000
notification.rate-limit.max-web-per-hour=5000
