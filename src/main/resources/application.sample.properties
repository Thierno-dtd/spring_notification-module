# ====================================
# APPLICATION CONFIGURATION
# ====================================
spring.application.name=notification-module
server.port=9001
server.servlet.context-path=/
server.error.include-stacktrace=on-param
server.error.include-message=always

# ====================================
# DATABASE CONFIGURATION
# ====================================
# H2 Database (pour développement/test)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# PostgreSQL (pour production)
#spring.datasource.url=jdbc:postgresql://localhost:5432/notifications
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.username=postgres
#spring.datasource.password=password

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ====================================
# REDIS CONFIGURATION
# ====================================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=5s
spring.data.redis.password=
spring.data.redis.lettuce.pool.max-active=20
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-idle=10
spring.data.redis.lettuce.pool.max-wait=5s

# ====================================
# CACHE CONFIGURATION
# ====================================
spring.cache.type=caffeine
spring.cache.cache-names=userNotifications,unreadNotifications,unreadCount,notification-templates
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=1h,recordStats

# ====================================
# ASYNC/THREAD POOL CONFIGURATION
# ====================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.pool.keep-alive=60s
spring.task.execution.thread-name-prefix=notification-async-
spring.task.execution.shutdown.await-termination=true
spring.task.execution.shutdown.await-termination-period=60s

# ====================================
# SWAGGER/OPENAPI CONFIGURATION
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1

# ====================================
# ACTUATOR/MONITORING CONFIGURATION
# ====================================
management.endpoints.web.exposure.include=health,info,metrics,prometheus,loggers
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# ====================================
# NOTIFICATION MODULE CONFIGURATION
# ====================================
notification.enabled=true
notification.jpa.enabled=true

# ===============================
# EMAIL CONFIGURATION
# ===============================
notification.email.enabled=true
notification.email.host=smtp.gmail.com
notification.email.port=587
notification.email.username=
notification.email.password=
notification.email.from=
notification.email.from-name=Notification Service
notification.email.auth-enabled=true
notification.email.tls-enabled=false
notification.email.start-tls-enabled=true
notification.email.protocol=smtp
notification.email.debug=false
notification.email.connection-timeout=5000
notification.email.read-timeout=5000

# Email Templates Configuration
#notification.email.templates.base-path=classpath:/templates/email/
#notification.email.templates.default-template=default
#notification.email.templates.encoding=UTF-8
spring.thymeleaf.check-template-location=false

# ===============================
# SMS CONFIGURATION
# ===============================
notification.sms.enabled=false
notification.sms.provider=twilio
notification.sms.from-number=+1234567890
notification.sms.region=us-east-1

# Twilio Configuration
notification.sms.twilio.account-sid=
notification.sms.twilio.auth-token=
notification.sms.twilio.messaging-service-sid=

# AWS SNS Configuration
notification.sms.aws-sns.access-key=
notification.sms.aws-sns.secret-key=
notification.sms.aws-sns.region=us-east-1

# Nexmo Configuration
notification.sms.nexmo.api-key=
notification.sms.nexmo.api-secret=
notification.sms.nexmo.application-id=
notification.sms.nexmo.private-key=

# Generic SMS Configuration
notification.sms.api-key=
notification.sms.api-secret=

# ===============================
# PUSH NOTIFICATION CONFIGURATION
# ===============================
notification.push.enabled=false
notification.push.provider=firebase
notification.push.api-key=
notification.push.api-secret=
notification.push.server-url=https://fcm.googleapis.com/fcm/send

# Firebase Configuration
notification.push.firebase.project-id=
notification.push.firebase.credentials-path=classpath:firebase-credentials.json
notification.push.firebase.credentials-json=
notification.push.firebase.server-key=
notification.push.firebase.database-url=

# Apple Push Notification Service (APNS)
notification.push.apns.key-id=
notification.push.apns.team-id=
notification.push.apns.key-path=
notification.push.apns.bundle-id=
notification.push.apns.production=false

# OneSignal Configuration
notification.push.one-signal.app-id=
notification.push.one-signal.api-key=
notification.push.one-signal.rest-api-key=

# ===============================
# WEB NOTIFICATION CONFIGURATION
# ===============================
notification.web.enabled=true
notification.web.webhook-url=
notification.web.api-key=
notification.web.max-cache-size=10000
notification.web.cache-retention=7d
notification.web.webhook-enabled=false
notification.web.web-push-enabled=false

# Web Push Configuration
notification.web.web-push.public-key=
notification.web.web-push.private-key=
notification.web.web-push.subject=mailto:admin@yourapp.com
notification.web.web-push.ttl=86400

# ===============================
# WEBSOCKET CONFIGURATION
# ===============================
notification.websocket.enabled=true
notification.websocket.endpoint=/ws/notifications
notification.websocket.allowed-origins=*
notification.websocket.sock-js-enabled=true
notification.websocket.application-destination-prefix=/app
notification.websocket.enable-simple-broker=/topic,/queue
notification.websocket.user-destination-prefix=/user
notification.websocket.max-session-idle-timeout=300
notification.websocket.max-text-message-buffer-size=8192
notification.websocket.max-binary-message-buffer-size=8192

# ===============================
# RETRY CONFIGURATION
# ===============================
notification.retry.max-attempts=3
notification.retry.initial-delay=PT5M
notification.retry.backoff-multiplier=2.0
notification.retry.max-delay=PT2H
notification.retry.exponential-backoff=true

# ===============================
# RATE LIMITING CONFIGURATION
# ===============================
notification.rate-limit.enabled=true
notification.rate-limit.max-notifications-per-minute=60
notification.rate-limit.max-notifications-per-hour=1000
notification.rate-limit.max-email-per-hour=500
notification.rate-limit.max-sms-per-hour=100
notification.rate-limit.max-push-per-hour=2000
notification.rate-limit.max-web-per-hour=5000

# Rate limiting per user
notification.rate-limit.max-notifications-per-user-per-minute=10
notification.rate-limit.max-notifications-per-user-per-hour=100

# ===============================
# CLEANUP CONFIGURATION
# ===============================
notification.cleanup.enabled=true
notification.cleanup.retention-period=P30D
notification.cleanup.cron-expression=0 0 2 * * ?
notification.cleanup.batch-size=1000
notification.cleanup.cleanup-read-notifications=true
notification.cleanup.cleanup-failed-notifications=false
notification.cleanup.failed-notification-retention=P7D

# ===============================
# CACHE CONFIGURATION (Module specific)
# ===============================
notification.cache.enabled=true
notification.cache.ttl=PT1H
notification.cache.max-size=10000
notification.cache.provider=caffeine

# Redis Cache Configuration (if using Redis)
notification.cache.redis.host=localhost
notification.cache.redis.port=6379
notification.cache.redis.password=
notification.cache.redis.database=0
notification.cache.redis.timeout=PT2S

# ====================================
# LOGGING CONFIGURATION
# ====================================
logging.level.root=INFO
logging.level.module.notification=DEBUG
logging.level.org.springframework.mail=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.cache=DEBUG
logging.level.org.springframework.scheduling=DEBUG

# Logging Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log Files
logging.file.name=logs/notification-service.log
logging.file.max-size=10MB
logging.file.max-history=30
logging.file.total-size-cap=300MB

# ====================================
# VALIDATION CONFIGURATION
# ====================================
spring.web.resources.add-mappings=false

# ====================================
# JSON CONFIGURATION
# ====================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ====================================
# TRANSACTION CONFIGURATION
# ====================================
spring.transaction.default-timeout=30s
spring.transaction.rollback-on-commit-failure=true

# ====================================
# SECURITY CONFIGURATION (Basic)
# ====================================
# Uncomment if using Spring Security
#spring.security.user.name=admin
#spring.security.user.password=admin
#spring.security.user.roles=ADMIN

# ====================================
# CORS CONFIGURATION
# ====================================
# Global CORS - can be overridden by @CrossOrigin
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.mvc.cors.allowed-headers=*
spring.mvc.cors.allow-credentials=false
spring.mvc.cors.max-age=3600

# ====================================
# ADDITIONAL SPRING BOOT CONFIGURATION
# ====================================
spring.main.banner-mode=console
spring.main.lazy-initialization=false
spring.profiles.active=dev
spring.output.ansi.enabled=detect

# Graceful shutdown
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
