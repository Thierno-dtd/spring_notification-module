# ====================================
# APPLICATION DE TEST NOTIFICATION
# ====================================
spring.application.name=notification-module
server.port=8080

# ====================================
# DATABASE CONFIGURATION (H2 pour tests)
# ====================================
# Base de données en mémoire pour les tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.hibernate.ddl-auto=create-drop
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

# ====================================
# SWAGGER/OPENAPI CONFIGURATION
# ====================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true

# ====================================
# NOTIFICATION MODULE CONFIGURATION
# ====================================

# Activation générale
notification.enabled=true

# EMAIL CONFIGURATION (Gmail pour test)


# SMS CONFIGURATION (Twilio pour test)
notification.sms.enabled=false
notification.sms.provider=twilio
notification.sms.from-number=+1234567890
notification.sms.twilio.account-sid=votre-twilio-sid
notification.sms.twilio.auth-token=votre-twilio-token

# WEBSOCKET CONFIGURATION
notification.websocket.enabled=true
notification.websocket.endpoint=/ws/notifications
notification.websocket.allowed-origins=*

# PUSH NOTIFICATIONS (désactivé pour test)
notification.push.enabled=false

# RETRY CONFIGURATION
notification.retry.max-attempts=3
notification.retry.initial-delay=PT5M
notification.retry.backoff-multiplier=2.0
notification.retry.max-delay=PT2H

# RATE LIMITING
notification.rate-limit.enabled=true
notification.rate-limit.max-notifications-per-minute=10
notification.rate-limit.max-notifications-per-hour=100
notification.rate-limit.max-email-per-hour=50
notification.rate-limit.max-sms-per-hour=20

# CACHE CONFIGURATION
spring.cache.cache-names=userNotifications,unreadNotifications,unreadCount
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=1h

# ====================================
# LOGGING CONFIGURATION
# ====================================
logging.level.module.notification=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ====================================
# ASYNC CONFIGURATION
# ====================================
spring.task.execution.pool.core-size=5
spring.task.execution.pool.max-size=20
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=notification-async-

# ====================================
# ACTUATOR (pour monitoring)
# ====================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always